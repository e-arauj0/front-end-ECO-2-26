<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Galeria Multimídia</title>
</head>

<body>

    <h1>Galeria Multimídia</h1>

    <img src="./imagem/capa.jpg" alt="Imagem de Capa da Galeria" width="100%" height="auto">

    <hr>

    <nav>
        <ul>
            <h3>Menu de navegação:</h3>
            <li><a href="./paginas/pag1.html">Página 1</a></li>
            <li><a href="./paginas/pag2.html">Página 2</a></li>
        </ul>
    </nav>

    <hr>

    <h2>Trilha sonora</h2>
    <audio controls>
        <source src="./audio/trilha-sonora.mp3" type="audio/mp3">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <hr>
    <h2>Vídeos da Galeria</h2>

    <h3>Nebulosa</h3>
    <video width="700" controls>
        <source src="./video/nebulosa.mp4" type="video/mp4">

    </video>

    <h3>Galáxia:</h3>
    <video width="700" controls>
        <source src="./video/galaxia.mp4" type="video/mp4">
        Seu navegador não suporta o elemento de vídeo.
    </video>

    <hr>

    <h2>Duração das Mídias</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Tipo de Mídia</th>
                <th>Nome do Arquivo</th>
                <th>Duração</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Áudio</td>
                <td>trilha_sonora.mp3</td>
                <td>04:59</td>
            </tr>
            <tr>
                <td>Vídeo</td>
                <td>nebulosa.mp4</td>
                <td>00:30</td>
            </tr>
            <tr>
                <td>Vídeo</td>
                <td>galaxia.mp4</td>
                <td>02:00</td>
            </tr>
        </tbody>
    </table>

</html>
