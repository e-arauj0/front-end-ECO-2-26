<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exercicio 1</title>
</head>
<body>
    
    <h1>Exercicio 1</h1>

    <hr>

    <h2>Evento no ifsp</h2>

    <form action="dados.html">

        <p>
            <label>Nome:</label>
            <input type="text" placeholder="Digite seu nome">
        </p>

        <p>
            <label>Email:</label>
            <input type="email" placeholder="Digite seu email">
        </p>

        <p>
            Curso
            <select>
                <option>ADS - Análise e Desenvolvimento de Sistemas</option>
                <option>TDS - Técnico em Desenvolvimento de Sistemas</option>
                <option>ECO - Engenharia da Computação</option>
            </select>
        </p>

        <p>
            Selecione qual horario deseja assistir:
            <br>
            <input type="radio" name="turno">9:00 ás 11:00 
            <br>
            <input type="radio" name="turno">19:00 ás 21:00 
        </p>
            
        <p>
            Dia do evento
            <select>
                <option>28/10/2026</option>
                <option>29/10/2026</option>

            </select>
        </p>

        <p>
            Possui alguma observação?
            <br>
            <textarea cols="30" rows="10"></textarea>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
