<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <title>Cadastro</title>
    <link rel="icon" type="image/png" href="../imagens/favicon(1).png">
    <link rel="stylesheet" type="text/css" href="../css/estilo.css">
</head>

<body>
    <main>
        <h1>Cadastro de alunos</h1>

        <form action="dados.html">
            <p>
                <label>Nome completo: </label>
                <input type="text" placeholder="Digite seu nome completo">
            </p>

            <p>
                <label>Email institucional: </label>
                <input type="email" placeholder="Digite seu email institucional">
            </p>

            <p>
                <label>Senha:</label>
                <input type="password" placeholder="Digite sua senha">
            </p>

            <p>
                <label>Curso:</label>
                <select>
                    <option>ECO</option>
                    <option>ECA</option>
                    <option>ADS</option>
                    <option>MAT</option>
                </select>
            </p>

            <p>
                <label>Semestre: </label>
                <input type="number" placeholder="Digite o semestre">
            </p>

            <p>
                <label>Turno: </label> <br>
                <input type="radio" name="turno" value="matutino">Matutino <br>
                <input type="radio" name="turno" value="vespertino">Vespertino <br>
                <input type="radio" name="turno" value="noturno">Noturno
            </p>

            <p>
                <label>Interesses: </label> <br>
                <input type="checkbox" name="interesses" value="tecnologia">Tecnologia <br>
                <input type="checkbox" name="interesses" value="esportes">Esportes <br>
                <input type="checkbox" name="interesses" value="musica">Música <br>
                <input type="checkbox" name="interesses" value="arte">Arte <br>
                <input type="checkbox" name="interesses" value="literatura">Literatura <br>
                <input type="checkbox" name="interesses" value="outros">Outros
            </p>

            <p>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 - IFSP Connect | Desenvolvido por Emily Oliveira Araujo (ECO)</p>
        <p>Disciplina de Desenvolvimento Front-End – Prof.ª Lucineide Pimenta</p>
    </footer>

</body>

</html>
